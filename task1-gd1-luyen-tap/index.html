<h1>Writing Task 1 – Giai đoạn 1: Luyện tập tự chấm</h1>
<div class="note"><b>Giai-doan-1</b> — Làm hết rồi bấm <b>Nộp bài</b>. Bài chấm tự động và giải thích từng câu. Số liệu trong bài là <b>giả định</b>.<br>
Nhập đáp án bằng chữ tiếng Anh (không cần viết hoa, "and" có hoặc không đều được). Cần đọc lại lý thuyết: <a href="../task1-gd1-sach-hoc/">sách học</a> · <a href="../task1-gd1-sach-hoc/sach-giai-doan-1.pdf">PDF</a>.</div>

<script>
var ITEMS=[{"sec": "A", "type": "fill", "norm": "words", "q": "Viết bằng chữ (tiếng Anh): <b>16</b>", "accept": ["sixteen"], "ans": "sixteen", "why": "16 đọc là: sixteen. (Có hoặc không có 'and' đều được; thousand/million không thêm -s.)", "id": "A1"}, {"sec": "A", "type": "fill", "norm": "words", "q": "Viết bằng chữ (tiếng Anh): <b>90</b>", "accept": ["ninety"], "ans": "ninety", "why": "90 đọc là: ninety. (Có hoặc không có 'and' đều được; thousand/million không thêm -s.)", "id": "A2"}, {"sec": "A", "type": "fill", "norm": "words", "q": "Viết bằng chữ (tiếng Anh): <b>175</b>", "accept": ["one hundred seventy five"], "ans": "one hundred and seventy-five", "why": "175 đọc là: one hundred and seventy-five. (Có hoặc không có 'and' đều được; thousand/million không thêm -s.)", "id": "A3"}, {"sec": "A", "type": "fill", "norm": "words", "q": "Viết bằng chữ (tiếng Anh): <b>4,300</b>", "accept": ["four thousand three hundred"], "ans": "four thousand three hundred", "why": "4,300 đọc là: four thousand three hundred. (Có hoặc không có 'and' đều được; thousand/million không thêm -s.)", "id": "A4"}, {"sec": "A", "type": "fill", "norm": "words", "q": "Viết bằng chữ (tiếng Anh): <b>85,000</b>", "accept": ["eighty five thousand"], "ans": "eighty-five thousand", "why": "85,000 đọc là: eighty-five thousand. (Có hoặc không có 'and' đều được; thousand/million không thêm -s.)", "id": "A5"}, {"sec": "A", "type": "fill", "norm": "words", "q": "Viết bằng chữ (tiếng Anh): <b>2,500,000</b>", "accept": ["two million five hundred thousand"], "ans": "two million five hundred thousand", "why": "2,500,000 đọc là: two million five hundred thousand. (Có hoặc không có 'and' đều được; thousand/million không thêm -s.)", "id": "A6"}, {"sec": "A", "type": "fill", "norm": "num", "q": "Viết bằng chữ số: <b>three hundred and twelve</b>", "accept": ["312"], "ans": "312", "why": "three hundred and twelve = 312 (dấu phẩy ngăn hàng nghìn).", "id": "A7"}, {"sec": "A", "type": "fill", "norm": "num", "q": "Viết bằng chữ số: <b>fifty-six thousand</b>", "accept": ["56000"], "ans": "56,000", "why": "fifty-six thousand = 56,000 (dấu phẩy ngăn hàng nghìn).", "id": "A8"}, {"sec": "A", "type": "fill", "norm": "num", "q": "Viết bằng chữ số: <b>one million eight hundred thousand</b>", "accept": ["1800000"], "ans": "1,800,000", "why": "one million eight hundred thousand = 1,800,000 (dấu phẩy ngăn hàng nghìn).", "id": "A9"}, {"sec": "A", "type": "mc", "q": "Số nào đúng trong tiếng Anh cho 'ba triệu hai trăm năm mươi nghìn'?", "opts": ["3.250.000", "3,250,000", "3,25 million"], "ok": 1, "why": "Tiếng Anh dùng dấu PHẨY ngăn hàng nghìn: 3,250,000. Dấu chấm kiểu 3.250.000 là kiểu Việt.", "id": "A10"}, {"sec": "A", "type": "mc", "q": "Cách viết nào đúng cho 'two point five million'?", "opts": ["2,5 million", "2.5 million", "2.5 millions"], "ok": 1, "why": "Thập phân dùng dấu CHẤM; million không thêm -s sau một con số.", "id": "A11"}, {"sec": "A", "type": "mc", "q": "Chọn câu đúng:", "opts": ["Five thousands people came.", "Five thousand people came.", "Five thousand of people came."], "ok": 1, "why": "Sau một con số, thousand không thêm -s và không cần 'of'.", "id": "A12"}, {"sec": "A", "type": "mc", "q": "25% có thể nói theo cách nào khác?", "opts": ["a quarter", "a third", "three quarters"], "ok": 0, "why": "25% = 1/4 = a quarter.", "id": "A13"}, {"sec": "A", "type": "fill", "norm": "text", "q": "Điền một từ: 50% of the students = ___ of the students (nửa).", "accept": ["half"], "ans": "half", "why": "50% = half.", "id": "A14"}, {"sec": "B", "type": "fill", "norm": "words", "q": "Đọc/viết thành chữ năm <b>1995</b>", "accept": ["nineteen ninety five"], "ans": "nineteen ninety-five", "why": "1995: nineteen ninety-five.", "id": "B1"}, {"sec": "B", "type": "fill", "norm": "words", "q": "Đọc/viết thành chữ năm <b>2004</b>", "accept": ["two thousand four", "two thousand four", "twenty oh four"], "ans": "two thousand and four (hoặc: two thousand four / twenty oh four)", "why": "2004: two thousand and four.", "id": "B2"}, {"sec": "B", "type": "fill", "norm": "words", "q": "Đọc/viết thành chữ năm <b>2013</b>", "accept": ["twenty thirteen", "two thousand thirteen", "two thousand thirteen"], "ans": "twenty thirteen (hoặc: two thousand and thirteen / two thousand thirteen)", "why": "2013: twenty thirteen.", "id": "B3"}, {"sec": "B", "type": "fill", "norm": "words", "q": "Đọc/viết thành chữ năm <b>2020</b>", "accept": ["twenty twenty", "two thousand twenty", "two thousand twenty"], "ans": "twenty twenty (hoặc: two thousand and twenty / two thousand twenty)", "why": "2020: twenty twenty.", "id": "B4"}, {"sec": "B", "type": "fill", "norm": "words", "q": "Đọc/viết thành chữ năm <b>1908</b>", "accept": ["nineteen oh eight", "nineteen zero eight"], "ans": "nineteen oh eight (hoặc: nineteen zero eight)", "why": "1908: nineteen oh eight.", "id": "B5"}, {"sec": "B", "type": "mc", "q": "'Những năm 1990' viết thế nào?", "opts": ["the 1990s", "the 1990's years", "1990 year"], "ok": 0, "why": "the 1990s (đọc: the nineteen nineties / the nineties).", "id": "B6"}, {"sec": "B", "type": "mc", "q": "'Từ năm 2000 đến năm 2010' viết thế nào?", "opts": ["from 2000 to 2010", "from 2000 until in 2010", "since 2000 to 2010"], "ok": 0, "why": "from … to … hoặc between … and ….", "id": "B7"}, {"sec": "B", "type": "mc", "q": "Biểu đồ ghi mốc 2008. Thì phù hợp để mô tả mốc đó là gì?", "opts": ["hiện tại đơn", "quá khứ đơn", "tương lai"], "ok": 1, "why": "Năm 2008 đã qua nên dùng quá khứ đơn (was/were, rose, fell…).", "id": "B8"}, {"sec": "C", "type": "mc", "q": "The <b>_____</b> of students in the class was 30.", "opts": ["number", "amount"], "ok": 0, "why": "students đếm được nên dùng number.", "id": "C1"}, {"sec": "C", "type": "mc", "q": "The <b>_____</b> of water used in 2010 was 500 million litres.", "opts": ["number", "amount"], "ok": 1, "why": "water không đếm được nên dùng amount.", "id": "C2"}, {"sec": "C", "type": "mc", "q": "The <b>_____</b> of money spent on food was $400.", "opts": ["number", "amount"], "ok": 1, "why": "money không đếm được nên dùng amount.", "id": "C3"}, {"sec": "C", "type": "mc", "q": "There were <b>_____</b> visitors in 2015 than in 2010.", "opts": ["less", "fewer"], "ok": 1, "why": "visitors đếm được số nhiều nên dùng fewer.", "id": "C4"}, {"sec": "C", "type": "mc", "q": "Families spent <b>_____</b> money on clothes in 2020 than in 2010.", "opts": ["less", "fewer"], "ok": 0, "why": "money không đếm được nên dùng less.", "id": "C5"}, {"sec": "C", "type": "mc", "q": "The number of tourists <b>_____</b> 2 million in 2005.", "opts": ["was", "were"], "ok": 0, "why": "The number of … + động từ SỐ ÍT. Năm 2005 đã qua nên dùng quá khứ.", "id": "C6"}, {"sec": "C", "type": "mc", "q": "A number of tourists <b>_____</b> unhappy with the service.", "opts": ["was", "were"], "ok": 1, "why": "A number of = một số, động từ SỐ NHIỀU.", "id": "C7"}, {"sec": "C", "type": "mc", "q": "The proportion of students who passed <b>_____</b> 60%.", "opts": ["was", "were"], "ok": 0, "why": "Chủ ngữ là proportion (số ít), không phải students.", "id": "C8"}, {"sec": "C", "type": "mc", "q": "Forty percent of the students <b>_____</b> women.", "opts": ["was", "were"], "ok": 1, "why": "% of + danh từ: động từ theo danh từ sau of; students số nhiều nên were.", "id": "C9"}, {"sec": "C", "type": "mc", "q": "Forty percent of the water <b>_____</b> used for farming.", "opts": ["was", "were"], "ok": 0, "why": "water không đếm được nên dùng was.", "id": "C10"}, {"sec": "C", "type": "mc", "q": "A quarter of the money <b>_____</b> spent on rent.", "opts": ["was", "were"], "ok": 0, "why": "money không đếm được nên dùng was.", "id": "C11"}, {"sec": "C", "type": "mc", "q": "The figures for Museum A and Museum B <b>_____</b> 50,000 and 36,000.", "opts": ["was", "were"], "ok": 1, "why": "figures số nhiều nên dùng were.", "id": "C12"}, {"sec": "C", "type": "mc", "q": "Spending on food <b>_____</b> $400 in 2015.", "opts": ["was", "were"], "ok": 0, "why": "spending không đếm được, số ít, dùng was.", "id": "C13"}, {"sec": "C", "type": "mc", "q": "Half of the families <b>_____</b> two cars in 2010.", "opts": ["had", "has"], "ok": 0, "why": "Mốc quá khứ: had. (Half of + danh từ số nhiều: động từ chia số nhiều, ở quá khứ không đổi.)", "id": "C14"}, {"sec": "D", "type": "mc", "q": "Số liệu: Museum B, năm 2005, 38 nghìn khách. Câu nào đúng nhất?", "opts": ["The number of visitors to Museum B was 38,000 in 2005.", "The number of visitors to Museum B were 38 in 2005.", "Museum B visitors 38,000 in 2005."], "ok": 0, "why": "Câu 4 ô đủ: Cái gì (the number of visitors to Museum B) + was + 38,000 (đã đổi nghìn → 38,000) + in 2005.", "id": "D1"}, {"sec": "D", "type": "mc", "q": "Số liệu: Thực phẩm = 35% ngân sách gia đình, năm 2010. Câu nào đúng nhất?", "opts": ["In 2010, 35% of the household budget was spent on food.", "In 2010, 35 percents of the household budget were spent on food.", "In 2010, 35% household budget spent on food."], "ok": 0, "why": "35% of + the household budget (số ít) → was spent; percent không -s; không thiếu 'of' và 'was'.", "id": "D2"}, {"sec": "D", "type": "mc", "q": "Số liệu: Hà Nội 1,700 mm mưa, năm 2020. Câu nào thiếu ĐƠN VỊ?", "opts": ["Hanoi had 1,700 mm of rain in 2020.", "Rainfall in Hanoi was 1,700 in 2020.", "In 2020, rainfall in Hanoi was 1,700 mm."], "ok": 1, "why": "'was 1,700' không nói 1,700 cái gì (mm). Mỗi con số phải có đơn vị.", "id": "D3"}, {"sec": "D", "type": "mc", "q": "Câu 'The amount of students was 300 in 2015.' mắc lỗi gì?", "opts": ["Thì", "Dùng amount với danh từ đếm được", "Dấu phẩy"], "ok": 1, "why": "students đếm được nên dùng number, không dùng amount.", "id": "D4"}, {"sec": "D", "type": "mc", "q": "Dịch đúng 'Năm 2015 / có 120 sinh viên / ở Trung tâm A':", "opts": ["In 2015, there were 120 students at Centre A.", "In 2015, there was 120 students at Centre A.", "In 2015 year, it has 120 students at Centre A."], "ok": 0, "why": "there + danh từ số nhiều: there were; mốc quá khứ; không có '2015 year'.", "id": "D5"}, {"sec": "D", "type": "mc", "q": "Một câu một điểm (câu 4 ô) cần tối thiểu những thành phần nào?", "opts": ["Cái gì + (was/were) + số kèm đơn vị + khi nào/ở đâu", "Chỉ cần con số", "Ý kiến cá nhân + con số"], "ok": 0, "why": "Bốn ô: cái gì, was/were, số + đơn vị, khi nào/ở đâu.", "id": "D6"}, {"sec": "D", "type": "fill", "norm": "text", "q": "Điền was hoặc were: In 2012, the number of cars sold ___ 500,000.", "accept": ["was"], "ans": "was", "why": "the number of → số ít → was.", "id": "D7"}, {"sec": "D", "type": "fill", "norm": "text", "q": "Điền was hoặc were: In 2012, there ___ 500,000 cars sold.", "accept": ["were"], "ans": "were", "why": "there + danh từ số nhiều → were.", "id": "D8"}, {"sec": "D", "type": "mc", "q": "Chọn câu KHÔNG có lỗi:", "opts": ["Spending on housing were $800 in 2015.", "Spending on housing was $800 in 2015.", "Spending on housing is $800 in 2015."], "ok": 1, "why": "spending số ít; mốc 2015 quá khứ → was.", "id": "D9"}, {"sec": "D", "type": "mc", "q": "Câu nào chọn từ hợp lý để nói 'số thực 49,300, hơi thiếu 50,000'?", "opts": ["The figure was just over 50,000.", "The figure was nearly 50,000.", "The figure was exactly 50,000."], "ok": 1, "why": "nearly = gần tới nhưng chưa tới.", "id": "D10"}], SEC={"A": ["Đọc và viết số", "Chương 5 của sách: dấu phẩy–chấm, thousand/million, thập phân, phân số"], "B": ["Năm và khoảng thời gian", "Chương 5, mục 5.6: cách đọc năm, from…to…, thì quá khứ"], "C": ["Lượng và hòa hợp", "Chương 6: number/amount, was/were, % of + danh từ"], "D": ["Câu 4 ô", "Chương 7: Cái gì + was/were + số + đơn vị + khi nào"]};
function norm(s,mode){s=String(s||'').toLowerCase().trim();
 if(mode=='words'){s=s.replace(/-/g,' ').replace(/,/g,' ').replace(/\band\b/g,' ');return s.split(/\s+/).filter(Boolean).join(' ')}
 if(mode=='num'){return s.replace(/[\s,]/g,'')}
 return s.replace(/\s+/g,' ')}
function accepted(it){var a=(it.accept||[it.ans]).slice();return a}
function render(list){var h='',cur='';list.forEach(function(it,i){
 if(it.sec!=cur){cur=it.sec;h+='<h2>'+it.sec+'. '+SEC[it.sec][0]+'</h2>'}
 h+='<div class="q" id="q_'+it.id+'"><b>'+it.id+'.</b> '+it.q;
 if(it.type=='mc'){it.opts.forEach(function(o,k){h+='<label class="opt"><input type="radio" name="r_'+it.id+'" value="'+k+'"> '+o+'</label>'})}
 else h+='<div style="margin-top:6px"><input type="text" id="t_'+it.id+'" autocomplete="off" autocapitalize="off" spellcheck="false"></div>';
 h+='<div class="why" id="w_'+it.id+'"></div></div>'});
 document.getElementById('qs').innerHTML=h}
var CUR=ITEMS;
function check(it){
 if(it.type=='mc'){var r=document.querySelector('input[name=r_'+it.id+']:checked');return !!r&&+r.value==it.ok}
 var v=document.getElementById('t_'+it.id).value;var m=it.norm||'text';var n=norm(v,m);
 return accepted(it).some(function(a){return norm(a,m)==n})}
function answerText(it){return it.type=='mc'?it.opts[it.ok]:(it.ans||accepted(it)[0])}
var wrong=[];
function submit(){var tot={},ok={};wrong=[];
 CUR.forEach(function(it){var good=check(it);tot[it.sec]=(tot[it.sec]||0)+1;if(good)ok[it.sec]=(ok[it.sec]||0)+1;else wrong.push(it);
  var q=document.getElementById('q_'+it.id);q.className='q '+(good?'ok':'bad');
  document.getElementById('w_'+it.id).innerHTML=(good?'✔ Đúng. ':'✘ Đáp án: <b>'+answerText(it)+'</b>. ')+it.why});
 var T=0,O=0,h='<div class="res"><h2 style="margin-top:0">Kết quả</h2>';
 Object.keys(tot).sort().forEach(function(k){T+=tot[k];O+=(ok[k]||0);var p=Math.round(100*(ok[k]||0)/tot[k]);
  h+='<p><b>'+k+'. '+SEC[k][0]+'</b>: '+(ok[k]||0)+'/'+tot[k]+' ('+p+'%)'+(p<80?' — nên đọc lại: '+SEC[k][1]:' — tốt')+'</p>'});
 var code=(tot.A?'':'')+Object.keys(tot).sort().map(function(k){return k+(ok[k]||0)+'/'+tot[k]}).join(' ')+' | tong '+O+'/'+T+' | '+new Date().toISOString().slice(0,10);
 h+='<p><b>Tổng: '+O+'/'+T+' ('+Math.round(100*O/T)+'%)</b></p><p class="small">Dán dòng này cho giáo viên:</p><code class="c">Giai-doan-1 '+code+'</code></div>';
 document.getElementById('out').innerHTML=h;
 document.getElementById('retry').style.display=wrong.length?'inline-block':'none';
 try{localStorage.setItem('Giai-doan-1',code)}catch(e){}
 document.getElementById('out').scrollIntoView({behavior:'smooth'})}
document.getElementById('sub').onclick=submit;
document.getElementById('retry').onclick=function(){CUR=wrong.slice();render(CUR);document.getElementById('out').innerHTML='';window.scrollTo(0,0)};
document.getElementById('reset').onclick=function(){CUR=ITEMS;render(CUR);document.getElementById('out').innerHTML='';document.getElementById('retry').style.display='none'};
render(CUR);
</script></body></html>
