<title>Writing Task 1 – Giai đoạn 2: Luyện tập tự chấm (xu hướng)</title><style>
body{font-family:system-ui,Segoe UI,Arial,sans-serif;max-width:820px;margin:0 auto;padding:16px;line-height:1.55;color:#1b2430;background:#fafbfd}
h1{font-size:1.5rem;color:#12355b}h2{font-size:1.15rem;color:#12355b;border-bottom:2px solid #cfd8e6;padding-bottom:4px;margin-top:28px}

<h1>Writing Task 1 – Giai đoạn 2: Luyện tập tự chấm (xu hướng)</h1>
<div class="note"><b>Giai-doan-2</b> — Làm hết rồi bấm <b>Nộp bài</b>. Bài chấm tự động và giải thích từng câu. Số liệu trong bài là <b>giả định</b>.<br>
Nhập đáp án bằng chữ tiếng Anh (không cần viết hoa, "and" có hoặc không đều được). Cần đọc lại lý thuyết: <a href="../task1-gd2-sach-hoc/">sách học</a> · <a href="../task1-gd2-sach-hoc/sach-giai-doan-2.pdf">PDF</a>.</div>
<form id="f" onsubmit="return false"><div id="qs"></div>
<button id="sub">Nộp bài</button><button class="sec" id="retry" style="display:none">Làm lại câu sai</button><button class="sec" id="reset">Làm lại từ đầu</button></form>
<div id="out"></div>
<script>
var ITEMS=[{"sec": "A", "type": "mc", "q": "Đường: 10, 14, 22, 34, 48 (tăng ngày càng dốc). Cụm hợp lý nhất?", "opts": ["rise sharply", "fall gradually", "remain stable"], "ok": 0, "why": "Tăng và dốc → rise sharply.", "id": "A1"}, {"sec": "A", "type": "mc", "q": "Đường: 50, 46, 43, 39, 35. Cụm hợp lý nhất?", "opts": ["rise sharply", "fall gradually", "fluctuate"], "ok": 1, "why": "Giảm từng chút → fall gradually.", "id": "A2"}, {"sec": "A", "type": "mc", "q": "Đường: 30, 30, 31, 30, 30. Cụm hợp lý nhất?", "opts": ["remain stable", "fluctuate", "peak"], "ok": 0, "why": "Gần như không đổi → remain stable.", "id": "A3"}, {"sec": "A", "type": "mc", "q": "Đường: 30, 45, 28, 47, 32. Động từ hợp lý nhất?", "opts": ["peak", "fluctuate", "level off"], "ok": 1, "why": "Nhiều lần lên xuống → fluctuate.", "id": "A4"}, {"sec": "A", "type": "mc", "q": "Đường: 20, 35, 50, 38, 25. Điều đúng nhất?", "opts": ["Có một đỉnh ở 50", "Dao động liên tục", "Giữ nguyên"], "ok": 0, "why": "Một đỉnh duy nhất → peak at 50.", "id": "A5"}, {"sec": "A", "type": "mc", "q": "Đường: 45, 30, 18, 30, 44. Điều đúng nhất?", "opts": ["Chạm đáy ở 18 rồi hồi phục", "Chỉ giảm", "Chỉ tăng"], "ok": 0, "why": "bottom out at 18, then recover.", "id": "A6"}, {"sec": "A", "type": "mc", "q": "Đường: 15, 28, 40, 40, 40. Điều đúng nhất?", "opts": ["Tăng rồi đi ngang", "Giảm rồi đi ngang", "Dao động"], "ok": 0, "why": "rise, then level off.", "id": "A7"}, {"sec": "A", "type": "mc", "q": "Hai đường cùng đầu 20, cùng cuối 30 nhưng một đường có đỉnh 50. Viết 'rose from 20 to 30' cho đường đó thì:", "opts": ["Đủ, vì có đầu và cuối", "Thiếu đỉnh quan trọng nhất", "Sai số"], "ok": 1, "why": "Phải nhắc đỉnh 50, không chỉ đầu và cuối.", "id": "A8"}, {"sec": "B", "type": "fill", "norm": "text", "q": "Quá khứ của <b>rise</b>:", "accept": ["rose"], "ans": "rose", "why": "rise – rose – risen.", "id": "B1"}, {"sec": "B", "type": "fill", "norm": "text", "q": "Quá khứ của <b>fall</b>:", "accept": ["fell"], "ans": "fell", "why": "fall – fell – fallen.", "id": "B2"}, {"sec": "B", "type": "fill", "norm": "text", "q": "Quá khứ của <b>grow</b>:", "accept": ["grew"], "ans": "grew", "why": "grow – grew – grown.", "id": "B3"}, {"sec": "B", "type": "fill", "norm": "text", "q": "Quá khứ của <b>go up</b>:", "accept": ["went up"], "ans": "went up", "why": "go – went – gone.", "id": "B4"}, {"sec": "B", "type": "fill", "norm": "text", "q": "Quá khứ của <b>hit</b>:", "accept": ["hit"], "ans": "hit", "why": "hit – hit – hit.", "id": "B5"}, {"sec": "B", "type": "fill", "norm": "text", "q": "Quá khứ của <b>decrease</b>:", "accept": ["decreased"], "ans": "decreased", "why": "Thêm -d.", "id": "B6"}, {"sec": "B", "type": "fill", "norm": "text", "q": "Quá khứ của <b>drop</b>:", "accept": ["dropped"], "ans": "dropped", "why": "Gấp đôi p: dropped.", "id": "B7"}, {"sec": "B", "type": "fill", "norm": "text", "q": "Quá khứ của <b>peak</b>:", "accept": ["peaked"], "ans": "peaked", "why": "Thêm -ed.", "id": "B8"}, {"sec": "C", "type": "mc", "q": "The number rose ___ 50,000 in 2010. (mức cuối là 50,000)", "opts": ["to", "by", "at"], "ok": 0, "why": "Mức đến → to.", "id": "C1"}, {"sec": "C", "type": "mc", "q": "The number rose ___ 30,000 between 2000 and 2010. (thêm 30,000)", "opts": ["to", "by", "at"], "ok": 1, "why": "Lượng thêm → by.", "id": "C2"}, {"sec": "C", "type": "mc", "q": "Prices stood ___ 12 thousand dong.", "opts": ["to", "by", "at"], "ok": 2, "why": "stood at.", "id": "C3"}, {"sec": "C", "type": "mc", "q": "Sales peaked ___ 60,000.", "opts": ["to", "by", "at"], "ok": 2, "why": "peaked at.", "id": "C4"}, {"sec": "C", "type": "mc", "q": "The price fluctuated ___ 12 and 24.", "opts": ["between", "at", "by"], "ok": 0, "why": "fluctuated between … and …", "id": "C5"}, {"sec": "C", "type": "mc", "q": "There was a sharp rise ___ prices.", "opts": ["of", "in", "by"], "ok": 1, "why": "a rise in + cái thay đổi.", "id": "C6"}, {"sec": "C", "type": "mc", "q": "Sales fell from 60,000 ___ 30,000.", "opts": ["to", "by", "at"], "ok": 0, "why": "from … to …", "id": "C7"}, {"sec": "C", "type": "mc", "q": "Energy use remained stable ___ 90 GWh.", "opts": ["at", "by", "to"], "ok": 0, "why": "remain stable at.", "id": "C8"}, {"sec": "D", "type": "mc", "q": "There was a ___ rise in sales.", "opts": ["sharp", "sharply", "sharpen"], "ok": 0, "why": "Trước danh từ dùng tính từ: sharp.", "id": "D1"}, {"sec": "D", "type": "mc", "q": "Sales rose ___ .", "opts": ["sharp", "sharply", "sharpness"], "ok": 1, "why": "Sau động từ dùng trạng từ.", "id": "D2"}, {"sec": "D", "type": "mc", "q": "Lượng điện tăng từ 90 lên 92. Trạng từ?", "opts": ["dramatically", "slightly", "rapidly"], "ok": 1, "why": "Thay đổi rất nhỏ → slightly.", "id": "D3"}, {"sec": "D", "type": "mc", "q": "Giá giảm từ 24 xuống 12 trong một năm. Trạng từ?", "opts": ["sharply", "slightly", "gradually"], "ok": 0, "why": "Giảm nhiều, nhanh → sharply.", "id": "D4"}, {"sec": "D", "type": "mc", "q": "Dân số giảm từ từ 20 năm. Trạng từ?", "opts": ["suddenly", "gradually", "dramatically"], "ok": 1, "why": "Chậm kéo dài → gradually.", "id": "D5"}, {"sec": "D", "type": "mc", "q": "Câu đúng:", "opts": ["The number was risen.", "The number rose.", "The number raised."], "ok": 1, "why": "Động từ xu hướng không bị động; raise cần tân ngữ.", "id": "D6"}, {"sec": "D", "type": "mc", "q": "There ___ a rise in the number of visitors.", "opts": ["was", "were", "are"], "ok": 0, "why": "a rise → was.", "id": "D7"}, {"sec": "D", "type": "mc", "q": "Câu đúng:", "opts": ["There was a fall of prices.", "There was a fall in prices.", "There was fall at prices."], "ok": 1, "why": "a fall in prices.", "id": "D8"}, {"sec": "E", "type": "fill", "norm": "num", "q": "Hiệu số: 50 − 20 =", "accept": ["30"], "ans": "30", "why": "50 − 20 = 30.", "id": "E1"}, {"sec": "E", "type": "fill", "norm": "num", "q": "Số cũ 20, số mới 50. Tăng bao nhiêu phần trăm? (chỉ số)", "accept": ["150"], "ans": "150", "why": "(50−20)÷20×100 = 150.", "id": "E2"}, {"sec": "E", "type": "fill", "norm": "num", "q": "Số cũ 50, số mới 30. Giảm bao nhiêu phần trăm? (chỉ số)", "accept": ["40"], "ans": "40", "why": "(50−30)÷50×100 = 40.", "id": "E3"}, {"sec": "E", "type": "fill", "norm": "num", "q": "Số cũ 60, số mới 12. Số mới bằng bao nhiêu phần trăm số cũ? (chỉ số)", "accept": ["20"], "ans": "20", "why": "12÷60×100 = 20.", "id": "E4"}, {"sec": "E", "type": "fill", "norm": "words", "q": "Viết bằng chữ số (words): 20 nghìn + 30 nghìn = bao nhiêu nghìn? Viết bằng chữ tiếng Anh:", "accept": ["fifty", "fifty thousand"], "ans": "fifty", "why": "50 nghìn: fifty thousand.", "id": "E5"}, {"sec": "E", "type": "fill", "norm": "text", "q": "Đường 60 → 12 trong 5 năm: số mới bằng 1/5 số cũ. Cụm hợp lý? (rose / fell)", "accept": ["fell"], "ans": "fell", "why": "Giảm → fell.", "id": "E6"}], SEC={"A": ["Đọc hình dạng", "Chương 1"], "B": ["Dạng quá khứ", "Chương 2"], "C": ["Giới từ to / by / at / from…to", "Chương 5"], "D": ["Từ loại, trạng từ, cấu trúc danh từ", "Chương 3–4"], "E": ["Tính hiệu số và phần trăm", "Mục 5.2–5.3"]};
function norm(s,mode){s=String(s||'').toLowerCase().trim();
 if(mode=='words'){s=s.replace(/-/g,' ').replace(/,/g,' ').replace(/\band\b/g,' ');return s.split(/\s+/).filter(Boolean).join(' ')}
 if(mode=='num'){return s.replace(/[\s,]/g,'')}
 return s.replace(/\s+/g,' ')}
function accepted(it){var a=(it.accept||[it.ans]).slice();return a}
function render(list){var h='',cur='';list.forEach(function(it,i){
 if(it.sec!=cur){cur=it.sec;h+='<h2>'+it.sec+'. '+SEC[it.sec][0]+'</h2>'}
 h+='<div class="q" id="q_'+it.id+'"><b>'+it.id+'.</b> '+it.q;
 if(it.type=='mc'){it.opts.forEach(function(o,k){h+='<label class="opt"><input type="radio" name="r_'+it.id+'" value="'+k+'"> '+o+'</label>'})}
 else h+='<div style="margin-top:6px"><input type="text" id="t_'+it.id+'" autocomplete="off" autocapitalize="off" spellcheck="false"></div>';
 h+='<div class="why" id="w_'+it.id+'"></div></div>'});
 document.getElementById('qs').innerHTML=h}
var CUR=ITEMS;
function check(it){
 if(it.type=='mc'){var r=document.querySelector('input[name=r_'+it.id+']:checked');return !!r&&+r.value==it.ok}
 var v=document.getElementById('t_'+it.id).value;var m=it.norm||'text';var n=norm(v,m);
 return accepted(it).some(function(a){return norm(a,m)==n})}
function answerText(it){return it.type=='mc'?it.opts[it.ok]:(it.ans||accepted(it)[0])}
var wrong=[];
function submit(){var tot={},ok={};wrong=[];
 CUR.forEach(function(it){var good=check(it);tot[it.sec]=(tot[it.sec]||0)+1;if(good)ok[it.sec]=(ok[it.sec]||0)+1;else wrong.push(it);
  var q=document.getElementById('q_'+it.id);q.className='q '+(good?'ok':'bad');
  document.getElementById('w_'+it.id).innerHTML=(good?'✔ Đúng. ':'✘ Đáp án: <b>'+answerText(it)+'</b>. ')+it.why});
 var T=0,O=0,h='<div class="res"><h2 style="margin-top:0">Kết quả</h2>';
 Object.keys(tot).sort().forEach(function(k){T+=tot[k];O+=(ok[k]||0);var p=Math.round(100*(ok[k]||0)/tot[k]);
  h+='<p><b>'+k+'. '+SEC[k][0]+'</b>: '+(ok[k]||0)+'/'+tot[k]+' ('+p+'%)'+(p<80?' — nên đọc lại: '+SEC[k][1]:' — tốt')+'</p>'});
 var code=(tot.A?'':'')+Object.keys(tot).sort().map(function(k){return k+(ok[k]||0)+'/'+tot[k]}).join(' ')+' | tong '+O+'/'+T+' | '+new Date().toISOString().slice(0,10);
 h+='<p><b>Tổng: '+O+'/'+T+' ('+Math.round(100*O/T)+'%)</b></p><p class="small">Dán dòng này cho giáo viên:</p><code class="c">Giai-doan-2 '+code+'</code></div>';
 document.getElementById('out').innerHTML=h;
 document.getElementById('retry').style.display=wrong.length?'inline-block':'none';
 try{localStorage.setItem('Giai-doan-2',code)}catch(e){}
 document.getElementById('out').scrollIntoView({behavior:'smooth'})}
document.getElementById('sub').onclick=submit;
document.getElementById('retry').onclick=function(){CUR=wrong.slice();render(CUR);document.getElementById('out').innerHTML='';window.scrollTo(0,0)};
document.getElementById('reset').onclick=function(){CUR=ITEMS;render(CUR);document.getElementById('out').innerHTML='';document.getElementById('retry').style.display='none'};
render(CUR);
</script></body></html>
